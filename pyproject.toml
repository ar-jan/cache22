[project]
name = "cache22"
version = "0.0.1"
description = "CLI for archiving Git repositories as mirrors or bundles"
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.6",
    "starlette>=1.7.0",
    "tomli-w>=1.2.0",
    "typer>=0.27.2",
    "uvicorn>=0.34",
]

[project.scripts]
cache22 = "cache22.cli:main"

[dependency-groups]
dev = [
    "check-jsonschema>=0.36.2",
    "httpx2>=2.13.1",
    "playwright>=1.50",
    "pre-commit>=4.5.1",
    "pyright>=1.1.408",
    "pytest>=9.0.0",
    "ruff>=0.15.4",
    "yamllint>=1.38.0",
]

[tool.ruff]
line-length = 100
indent-width = 4

[tool.ruff.lint]
extend-select = [
    "E4", "E7", "E9", "F",  # Preserve the previous default checks
    "B",                    # Full flake8-bugbear checks
    "PT011",                # Avoid overly broad pytest.raises
    "PT012",                # Avoid multiple statements inside pytest.raises
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
line-ending = "lf"

[tool.pyright]
venvPath = "."
venv = ".venv"

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"
